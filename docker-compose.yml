
services:
  postgres:
    image: postgres:16-alpine
    container_name: payment_gateway_db
    environment:
      POSTGRES_USER: ${DB_USER:-pguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgpassword}
      POSTGRES_DB: ${DB_NAME:-payment_gateway}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pguser} -d ${DB_NAME:-payment_gateway}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: payment_gateway_db_test
    environment:
      POSTGRES_USER: ${DB_USER:-pguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgpassword}
      POSTGRES_DB: payment_gateway_test
    ports:
      - '${DB_TEST_PORT:-5433}:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pguser} -d payment_gateway_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgdata_test:
